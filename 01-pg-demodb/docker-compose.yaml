services:
  dbinit:
    image: busybox:1.37
    container_name: ${DBINIT_CONTAINER_NAME:-pg-dbinit}
    environment:
      DATASET_URLS: ${DATASET_URLS:-https://edu.postgrespro.ru/demo-20250901-2y.sql.gz}
      DATASET_MIRROR_URLS: ${DATASET_MIRROR_URLS:-}
    volumes:
      - init-sql:/init
    networks:
      - db-net
    restart: on-failure
    command:
      - sh
      - -c
      - |
        set -eu
        cat > /init/00-prepare.sh << 'EOF'
        #!/bin/sh
        set -eu
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$${POSTGRES_DB:-postgres}" <<'SQL'
        SELECT format('CREATE DATABASE demo WITH TEMPLATE = template0 ENCODING = %L LOCALE = %L', 'UTF8', 'en_US.UTF-8')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'demo')\gexec
        SQL
        EOF
        chmod +x /init/00-prepare.sh
        n=0
        printf '%s\n' "$$DATASET_URLS" | tr ',' '\n' > /tmp/urls
        printf '%s\n' "$$DATASET_MIRROR_URLS" | tr ',' '\n' > /tmp/mirrors
        while IFS= read -r url; do
          [ -n "$$url" ] || continue
          n=$$((n + 1))
          mirror=$$(sed -n "$${n}p" /tmp/mirrors || true)
          dest="/init/$$(printf '%02d' "$$n")-data.sql.gz"
          if [ -s "$$dest" ]; then
            continue
          fi
          tmp="$$dest.partial"
          rm -f "$$tmp"
          if wget -q -O "$$tmp" "$$url"; then
            mv "$$tmp" "$$dest"
            continue
          fi
          rm -f "$$tmp"
          if [ -z "$$mirror" ]; then
            echo "download failed: $$url" >&2
            exit 1
          fi
          wget -q -O "$$tmp" "$$mirror"
          mv "$$tmp" "$$dest"
        done < /tmp/urls

  db:
    image: postgres:18.6
    container_name: ${DB_CONTAINER_NAME:-pg}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_wal_size=4GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - init-sql:/docker-entrypoint-initdb.d:ro
    networks:
      - db-net
    depends_on:
      dbinit:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90m

volumes:
  init-sql:
  postgres-data:

networks:
  db-net:
    name: ${DB_NETWORK_NAME:-pg-net}
